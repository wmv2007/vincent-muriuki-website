<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honest Shoppers</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="left-section">
      <a class="left" href="index.html">
        <p class="shop-logo">HONEST <span>SHOPPERS</span></p>
      </a>
    </div>

    <div class="middle-section">
      <input class="search-bar" type="text" placeholder="search">
      <button class="search-button">
        <img class="search-icon" src="../../examples/javascript-amazon-project-main/images/icons/search-icon.png"
          alt="search icon">
      </button>
    </div>


    <div class="right-section">
      <p class="cart">Cart</p>
      <div class="cart-right">
        <a href="cart.html">
          <img class="cart-icon" src="../../examples/javascript-amazon-project-main/images/icons/cart-icon.png"
            alt="cart icon">
        </a>
        <p class="cart-quantity">0</p>
      </div>
    </div>
  </header>

  <main class="js-main">

  </main>

  <script src="scripts/index.js" type="module"></script>
</body>

</html>
